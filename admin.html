<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mascot Cam — Admin</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #11161d;
    --tile: #262d38;
    --tile-on: #3a4352;
    --line: #2b3340;
    --fg: #f2f4f7;
    --muted: #9aa4b2;
    --accent: #ffb020;
    --danger: #ff6b6b;
    --ok: #7ee2a8;
    --draft: #c3a2ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; -webkit-user-select: none; user-select: none;
    display: flex; flex-direction: column;
  }
  video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  button, input, select { font: inherit; color: var(--fg); }
  button {
    border: 0; border-radius: 10px; padding: 9px 14px;
    background: var(--tile); cursor: pointer; font-weight: 600;
  }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #1a1200; }
  button.danger { background: var(--danger); color: #2a0000; }
  button.ghost { background: transparent; border: 1px solid var(--line); }
  button.on { background: var(--tile-on); box-shadow: inset 0 0 0 2px var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  input[type=text], input[type=number], input[type=email], input[type=password], select {
    background: #0a0e14; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .tiny { font-size: 12px; }

  /* ---------- stage ---------- */
  #stageWrap {
    position: relative; flex: 0 0 auto; height: 42vh; min-height: 220px;
    background: #000; overflow: hidden;
  }
  #out { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; touch-action: none; }
  .stageTag {
    position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 10px;
    background: rgba(0,0,0,.6); padding: 5px 9px; border-radius: 6px;
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  }
  .stageTag.ok { color: var(--ok); }
  .stageBtns {
    position: absolute; right: 8px; top: calc(8px + env(safe-area-inset-top));
    display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
  }
  .stageBtns button { padding: 7px 10px; font-size: 13px; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); }
  .faceNav {
    position: absolute; left: 0; right: 0; bottom: 8px;
    display: flex; justify-content: center; align-items: center; gap: 10px;
  }
  .faceNav button { padding: 6px 12px; background: rgba(0,0,0,.6); }
  .faceNav .label { background: rgba(0,0,0,.6); padding: 5px 10px; border-radius: 8px; font-size: 12px; }

  /* ---------- panel ---------- */
  #panel {
    flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    background: var(--panel); border-top: 1px solid var(--line);
  }
  .topbar {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-bottom: 1px solid var(--line); flex: none;
  }
  .topbar .who { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .partName { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; font-weight: 700; flex: none; }
  .badge.pub { background: rgba(126,226,168,.18); color: var(--ok); }
  .badge.draft { background: rgba(195,162,255,.18); color: var(--draft); }
  .badge.dirty { background: rgba(255,176,32,.2); color: var(--accent); }

  .tabs { display: flex; gap: 4px; padding: 6px 8px; overflow-x: auto; border-bottom: 1px solid var(--line); flex: none; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; background: transparent; color: var(--muted); padding: 7px 12px; font-size: 14px; }
  .tabs button[aria-selected="true"] { background: var(--tile-on); color: var(--fg); }

  .panes { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 10px 10px calc(16px + env(safe-area-inset-bottom)); }
  /* Phone-first, but the controls shouldn't stretch across a laptop screen. */
  .pane { display: flex; flex-direction: column; gap: 12px; max-width: 760px; margin: 0 auto; }
  .group { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 9px; }
  .group > h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.tight { gap: 6px; }
  .grow { flex: 1 1 auto; min-width: 0; }

  /* numeric control */
  .num { display: grid; grid-template-columns: 74px 1fr auto; gap: 8px; align-items: center; }
  .num > label { font-size: 13px; color: var(--muted); }
  .num .box { display: flex; gap: 4px; align-items: center; }
  .num input[type=number] { width: 76px; text-align: right; padding: 6px 7px; }
  .num .nudge { padding: 6px 9px; font-size: 14px; line-height: 1; background: var(--tile); }

  /* library */
  .search { display: flex; gap: 8px; }
  .slotGroup > h4 { margin: 10px 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .items { display: flex; flex-direction: column; gap: 6px; }
  .item {
    display: flex; align-items: center; gap: 10px; padding: 6px 8px;
    background: var(--tile); border-radius: 10px; border: 2px solid transparent; cursor: pointer; text-align: left;
    width: 100%;
  }
  .item.on { border-color: var(--accent); }
  .item canvas, .item .ph {
    width: 44px; height: 44px; flex: none; border-radius: 8px; background: #0a0e14;
    display: grid; place-items: center; font-size: 11px; color: var(--muted);
  }
  .item .meta { flex: 1 1 auto; min-width: 0; }
  .item .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* meters */
  .meter { display: grid; grid-template-columns: 86px 1fr 44px; gap: 8px; align-items: center; font-size: 13px; }
  .meter .bar { height: 8px; background: #0a0e14; border-radius: 999px; overflow: hidden; }
  .meter .fill { height: 100%; background: var(--accent); width: 0%; }
  .meter .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

  /* reactions */
  .rx { border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 7px; }
  .rx .line { display: flex; gap: 6px; align-items: center; }
  .rx select { flex: 1 1 0; min-width: 0; }

  /* versions */
  .ver { display: flex; gap: 8px; align-items: center; padding: 7px 8px; background: var(--tile); border-radius: 9px; }
  .ver .vmeta { flex: 1 1 auto; min-width: 0; font-size: 13px; }

  /* grid check */
  #gridWrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  #gridWrap figure { margin: 0; }
  #gridWrap canvas { width: 100%; border-radius: 10px; background: #000; display: block; }
  #gridWrap figcaption { font-size: 11px; color: var(--muted); text-align: center; padding-top: 3px; }

  /* overlays */
  .sheet {
    position: fixed; inset: 0; background: rgba(5,8,12,.92); z-index: 40;
    display: flex; align-items: center; justify-content: center; padding: 18px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; width: 100%; max-width: 420px; max-height: 88vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px;
  }
  .card h2 { margin: 0; font-size: 1.15rem; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 60;
    background: #1b2330; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; max-width: 90vw;
  }
  .toast.bad { border-color: var(--danger); color: #ffd7d7; }
  .toast.good { border-color: var(--ok); }
</style>
</head>
<body>
  <video id="cam" playsinline autoplay muted></video>

  <div id="stageWrap">
    <canvas id="out"></canvas>
    <div class="stageTag" id="stageTag">Starting…</div>
    <div class="stageBtns">
      <button id="freezeBtn" class="ghost">Freeze</button>
      <button id="dotsBtn" class="ghost">Dots</button>
      <button id="camBtn" class="ghost">Camera</button>
    </div>
    <div class="faceNav" id="faceNav" hidden>
      <button id="facePrev" aria-label="Previous test face">‹</button>
      <span class="label" id="faceLabel">Live</span>
      <button id="faceNext" aria-label="Next test face">›</button>
    </div>
  </div>

  <div id="panel">
    <div class="topbar">
      <span class="partName" id="partName">No part selected</span>
      <span class="badge" id="partBadge" hidden></span>
      <span class="who" id="who"></span>
    </div>

    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="panes" id="panes"></div>
  </div>

<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module" src="./js/admin.js"></script>
</body>
</html>
