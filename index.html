<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mascot Cam Test</title>
<style>
  :root {
    --bg: #0d1117;
    --fg: #f2f4f7;
    --muted: #9aa4b2;
    --accent: #ffb020;
    --danger: #ff6b6b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  video {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    background: #000;
  }
  video.mirror { transform: scaleX(-1); }
  .start {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; text-align: center;
    padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left));
  }
  h1 { margin: 0; font-size: 1.6rem; text-wrap: balance; }
  p { margin: 0; color: var(--muted); max-width: 32ch; }
  button {
    font: inherit; font-weight: 700;
    border: 0; border-radius: 999px;
    padding: 14px 28px;
    background: var(--accent); color: #1a1200;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  .error { color: var(--danger); }
  .bar {
    position: fixed; left: 0; right: 0;
    bottom: 0;
    display: flex; justify-content: center; gap: 12px;
    padding: 16px max(16px, env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: linear-gradient(transparent, rgba(0,0,0,.6));
  }
  .bar button.ghost { background: rgba(255,255,255,.18); color: var(--fg); backdrop-filter: blur(6px); }
  .tag {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left));
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    background: rgba(0,0,0,.5); padding: 6px 10px; border-radius: 6px;
  }
  .help {
    position: fixed; inset: 0;
    overflow-y: auto;
    padding: calc(32px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    display: flex; flex-direction: column; gap: 18px;
    max-width: 480px; margin: 0 auto;
  }
  .help h2 { margin: 0; font-size: 1.4rem; text-wrap: balance; }
  .help ol { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 12px; }
  .help li { padding-left: 4px; }
  .help b { color: var(--accent); }
  .help .note { font-size: 14px; color: var(--muted); max-width: none; }
  .help button { align-self: stretch; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <video id="cam" class="mirror" playsinline autoplay muted hidden></video>

  <div class="start" id="start">
    <h1>Mascot Cam Test</h1>
    <p>Tap the button, then tap “Allow” when your phone asks to use the camera.</p>
    <button id="go">Turn on camera</button>
    <p class="error" id="err" hidden></p>
  </div>

  <div class="help" id="help" hidden>
    <h2 id="helpTitle">Your camera is turned off for this site</h2>
    <p id="helpIntro">Your phone won't let a website open Settings for you. Follow these steps, then tap “Try again.”</p>
    <ol id="helpSteps"></ol>
    <button id="retry">Try again</button>
    <p class="note" id="helpNote"></p>
    <p class="note" id="diag"></p>
  </div>

  <div class="tag" id="tag" hidden>Front camera</div>

  <div class="bar" id="bar" hidden>
    <button class="ghost" id="flip">Flip camera</button>
    <button class="ghost" id="stop">Stop</button>
  </div>

<script>
  const video = document.getElementById('cam');
  const start = document.getElementById('start');
  const bar = document.getElementById('bar');
  const tag = document.getElementById('tag');
  const err = document.getElementById('err');
  let stream = null;
  let facing = 'user'; // 'user' = front camera, 'environment' = back camera

  function showError(msg) {
    err.textContent = msg;
    err.hidden = false;
  }

  async function openCamera() {
    err.hidden = true;
    if (!window.isSecureContext) {
      return showError('This page must be opened with https:// for the camera to work.');
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return showError('This browser does not support the camera. Try Safari or Chrome.');
    }
    stopCamera();
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      video.classList.toggle('mirror', facing === 'user');
      video.hidden = false;
      start.hidden = true;
      bar.hidden = false;
      tag.hidden = false;
      tag.textContent = facing === 'user' ? 'Front camera' : 'Back camera';
    } catch (e) {
      start.hidden = false;
      if (e.name === 'NotAllowedError') {
        showHelp(e);
      } else if (e.name === 'NotFoundError') {
        showError('No camera was found on this device.');
      } else {
        showError('Could not start the camera: ' + e.message);
      }
    }
  }

  // Work out which browser the person is using, so we show the right steps.
  function whichBrowser() {
    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const inApp = /FBAN|FBAV|Instagram|Snapchat|Twitter|LinkedInApp|TikTok|musical_ly|GSA\//.test(ua);
    if (isIOS && inApp) return 'ios-inapp';
    if (isIOS && /CriOS/.test(ua)) return 'ios-chrome';
    if (isIOS && /FxiOS/.test(ua)) return 'ios-firefox';
    if (isIOS) return 'ios-safari';
    if (/Android/.test(ua)) return 'android-chrome';
    return 'desktop';
  }

  const STEPS = {
    'ios-safari': {
      steps: [
        'Tap <b>aA</b> (or the page icon) on the left side of the address bar.',
        'Tap <b>Website Settings</b>.',
        'Tap <b>Camera</b> and choose <b>Allow</b> (or <b>Ask</b>).',
        'Tap <b>Done</b>, then tap <b>Try again</b> below.'
      ],
      note: 'Still blocked? Open the Settings app → Apps → Safari → Camera, and choose Ask or Allow. Then come back and reload this page.'
    },
    'ios-chrome': {
      steps: [
        'Open the iPhone <b>Settings</b> app.',
        'Tap <b>Apps</b>, then <b>Chrome</b>.',
        'Turn on <b>Camera</b>.',
        'Come back here and tap <b>Try again</b>.'
      ],
      note: 'If Chrome asks again, tap Allow.'
    },
    'ios-firefox': {
      steps: [
        'Open the iPhone <b>Settings</b> app.',
        'Tap <b>Apps</b>, then <b>Firefox</b>.',
        'Turn on <b>Camera</b>.',
        'Come back here and tap <b>Try again</b>.'
      ],
      note: ''
    },
    'ios-inapp': {
      steps: [
        'This page opened inside another app, which blocks the camera.',
        'Tap the <b>⋯</b> or share button in the corner.',
        'Choose <b>Open in Safari</b> (or Open in browser).',
        'Tap <b>Turn on camera</b> again there.'
      ],
      note: ''
    },
    'android-chrome': {
      steps: [
        'Tap the <b>icon left of the web address</b>.',
        'Tap <b>Permissions</b> (or Site settings).',
        'Turn on <b>Camera</b>.',
        'Tap <b>Try again</b> below.'
      ],
      note: ''
    },
    'desktop': {
      steps: [
        'Click the <b>icon left of the web address</b>.',
        'Set <b>Camera</b> to <b>Allow</b>.',
        'Click <b>Try again</b> below.'
      ],
      note: ''
    }
  };

  async function showHelp(e) {
    const info = STEPS[whichBrowser()];
    let perm = 'unknown';
    try { perm = (await navigator.permissions.query({ name: 'camera' })).state; } catch (_) {}
    document.getElementById('diag').textContent =
      'Details: browser=' + whichBrowser() +
      ' · address=' + location.protocol + '//' + location.host +
      ' · permission=' + perm +
      ' · error=' + e.name + ' (' + e.message + ')';
    document.getElementById('helpSteps').innerHTML = info.steps.map(s => '<li>' + s + '</li>').join('');
    const note = document.getElementById('helpNote');
    note.textContent = info.note;
    note.hidden = !info.note;
    start.hidden = true;
    document.getElementById('help').hidden = false;
  }

  document.getElementById('retry').onclick = () => {
    document.getElementById('help').hidden = true;
    start.hidden = false;
    // Safari sometimes only picks up the new setting after a reload.
    if (whichBrowser().startsWith('ios')) { location.reload(); } else { openCamera(); }
  };

  function stopCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  document.getElementById('go').onclick = openCamera;
  document.getElementById('flip').onclick = () => {
    facing = facing === 'user' ? 'environment' : 'user';
    openCamera();
  };
  document.getElementById('stop').onclick = () => {
    stopCamera();
    video.hidden = true; bar.hidden = true; tag.hidden = true;
    start.hidden = false;
  };
</script>
</body>
</html>
